name: Build VYRA iOS Simulator (Appetize Ready)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack iOS source
        run: |
          rm -rf build-src build-output
          mkdir -p build-src
          unzip -q VYRA-Viewer-iPhone-iPad-Client-v1.zip -d build-src
          find build-src -maxdepth 4 -type d -name "*.xcodeproj" -print

      - name: Show Xcode version
        run: |
          xcodebuild -version
          uname -m

      - name: Build universal iOS Simulator app
        run: |
          set -o pipefail
          PROJECT="$(find build-src -type d -name 'VYRAViewerIOS.xcodeproj' | head -1)"
          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -target VYRAViewerIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            EXCLUDED_ARCHS="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            BUILD_DIR="$PWD/build-output" \
            clean build | tee xcodebuild.log

      - name: Verify simulator bundle
        run: |
          set -e
          APP="$(find build-output -type d -name 'VYRAViewerIOS.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "Built .app not found"
            exit 1
          fi

          PLIST="$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$PLIST")

          echo "App: $APP"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"
          echo "Platform: $PLATFORM"

          test -n "$BUNDLE_ID"
          test -f "$APP/$EXECUTABLE"
          test "$PLATFORM" = "iPhoneSimulator"

          echo "Architectures:"
          lipo -archs "$APP/$EXECUTABLE"
          lipo -verify_arch arm64 x86_64 "$APP/$EXECUTABLE"

      - name: Package Appetize-ready simulator app
        run: |
          set -e
          APP="$(find build-output -type d -name 'VYRAViewerIOS.app' | head -1)"
          rm -f VYRAViewerIOS-Appetize.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" VYRAViewerIOS-Appetize.zip
          echo "ZIP contents:"
          unzip -l VYRAViewerIOS-Appetize.zip | head -40

      - name: Upload Appetize build
        uses: actions/upload-artifact@v4
        with:
          name: VYRAViewerIOS-Appetize
          path: VYRAViewerIOS-Appetize.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-appetize-log
          path: xcodebuild.log
          if-no-files-found: ignore
